<!DOCTYPE html>
<html lang="en">
<head>

    <title>{% block title %}VPN OAuth Lab{% endblock %}</title>
</head>
<body>

<h1>Vladimir Kuryndin's VPN OAuth Lab</h1>

<nav>
    <a href="/">Home</a> |
    <a href="/page1">Page 1</a> |
    <a href="/page2">Page 2</a> |

    <a href="/profile">Profile</a>

</nav>

<hr>
